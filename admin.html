<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JKK 管理后台</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <!-- ── 设置界面（首次进入） ── -->
    <div class="setup-screen" id="setupScreen">
        <div class="setup-card">
            <h1>⚙️ JKK 管理后台</h1>
            <p class="setup-desc">配置 GitHub 仓库信息，之后所有修改将通过 API 直接提交。</p>
            <div class="setup-field">
                <label>GitHub 用户名 / 组织</label>
                <input type="text" id="setupOwner" placeholder="例如: jkk">
            </div>
            <div class="setup-field">
                <label>仓库名称</label>
                <input type="text" id="setupRepo" placeholder="例如: jkk.github.io">
            </div>
            <div class="setup-field">
                <label>Personal Access Token</label>
                <input type="password" id="setupToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
                <p class="setup-hint">
                    👆 <a href="https://github.com/settings/tokens" target="_blank">点此生成 Token</a>，
                    勾选 <code>repo</code> 或 <code>public_repo</code> 权限。
                </p>
            </div>
            <div class="setup-field">
                <label>分支名称</label>
                <input type="text" id="setupBranch" value="main">
            </div>
            <button class="setup-btn" id="setupBtn">🔗 连接仓库</button>
            <p class="setup-error" id="setupError"></p>
            <div class="setup-divider">
                <span>或者</span>
            </div>
            <button class="setup-btn setup-btn-manual" id="manualModeBtn">📝 手动编辑模式（无需 Token）</button>
        </div>
    </div>

    <!-- ── 主界面 ── -->
    <div class="admin-app" id="adminApp" style="display:none;">

        <!-- 顶栏 -->
        <header class="admin-header">
            <div class="admin-header-left">
                <h1 class="admin-title">📝 JKK 管理后台</h1>
                <span class="admin-repo-badge" id="repoBadge"></span>
            </div>
            <div class="admin-header-right">
                <span class="admin-status" id="adminStatus">✅ 已加载</span>
                <button class="admin-btn admin-btn-primary" id="saveBtn">💾 保存到 GitHub</button>
                <button class="admin-btn admin-btn-outline" id="downloadBtn">📥 下载 content.json</button>
                <button class="admin-btn admin-btn-outline" id="reloadBtn">🔄 重新加载</button>
                <button class="admin-btn admin-btn-ghost" id="settingsBtn">⚙️</button>
            </div>
        </header>

        <div class="admin-body">
            <!-- 侧栏：分类列表 -->
            <aside class="admin-sidebar">
                <div class="admin-sidebar-section">
                    <h3>📂 分类</h3>
                    <ul class="admin-cat-list" id="catList">
                        <!-- 由 JS 生成 -->
                    </ul>
                </div>
                <div class="admin-sidebar-section">
                    <h3>🔗 快捷链接</h3>
                    <ul class="admin-quick-links">
                        <li><a href="index.html" target="_blank">🌐 查看公开网页</a></li>
                        <li><a href="data/content.json" target="_blank">📄 查看 content.json</a></li>
                    </ul>
                </div>
            </aside>

            <!-- 主编辑区 -->
            <main class="admin-main">
                <!-- 分类标题 -->
                <div class="admin-cat-header">
                    <h2 id="currentCatTitle">选择分类</h2>
                    <span class="admin-entry-count" id="entryCount">0 条</span>
                    <button class="admin-btn admin-btn-accent" id="addEntryBtn">＋ 新增条目</button>
                </div>

                <!-- 条目列表 -->
                <div class="admin-entry-list" id="entryList">
                    <p class="admin-placeholder">请从左侧选择一个分类</p>
                </div>

                <!-- 编辑器面板 -->
                <div class="admin-editor" id="editor" style="display:none;">
                    <div class="editor-header">
                        <h3 id="editorTitle">编辑条目</h3>
                        <div class="editor-actions">
                            <button class="admin-btn admin-btn-sm" id="editorCloseBtn">✕ 关闭</button>
                        </div>
                    </div>
                    <div class="editor-body">
                        <div class="editor-row">
                            <div class="editor-field">
                                <label>中文标题 *</label>
                                <input type="text" id="editTitleZh" placeholder="中文标题">
                            </div>
                            <div class="editor-field">
                                <label>English Title *</label>
                                <input type="text" id="editTitleEn" placeholder="English title">
                            </div>
                        </div>
                        <div class="editor-row">
                            <div class="editor-field">
                                <label>日期 *</label>
                                <input type="date" id="editDate">
                            </div>
                            <div class="editor-field">
                                <label>ID（自动生成，可手动改）</label>
                                <input type="text" id="editId" placeholder="自动生成">
                            </div>
                        </div>
                        <div class="editor-row">
                            <div class="editor-field">
                                <label>中文标签（逗号分隔）</label>
                                <input type="text" id="editTagsZh" placeholder="小说, 日本文学">
                            </div>
                            <div class="editor-field">
                                <label>English Tags</label>
                                <input type="text" id="editTagsEn" placeholder="Fiction, Japanese">
                            </div>
                        </div>
                        <div class="editor-field">
                            <label>中文内容（Markdown）</label>
                            <textarea id="editContentZh" rows="5" placeholder="支持 Markdown 格式"></textarea>
                        </div>
                        <div class="editor-field">
                            <label>English Content (Markdown)</label>
                            <textarea id="editContentEn" rows="5" placeholder="Markdown supported"></textarea>
                        </div>
                        <div class="editor-row">
                            <div class="editor-field">
                                <label>图片路径（每行一个）</label>
                                <textarea id="editImages" rows="2" placeholder="images/photo.jpg"></textarea>
                            </div>
                            <div class="editor-field">
                                <label>外部链接（每行：文字,网址）</label>
                                <textarea id="editLinks" rows="2" placeholder="豆瓣,https://example.com"></textarea>
                            </div>
                            <div class="editor-field">
                                <label>视频链接（每行一个）</label>
                                <textarea id="editVideos" rows="2" placeholder="https://www.bilibili.com/video/BVxxx"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="editor-footer">
                        <button class="admin-btn admin-btn-danger" id="deleteEntryBtn">🗑 删除此条目</button>
                        <span class="editor-save-hint">更改会在点击顶部"保存到 GitHub"后统一提交</span>
                        <button class="admin-btn admin-btn-primary" id="editorApplyBtn">✓ 应用更改</button>
                    </div>
                </div>

                <!-- 未保存更改提示条 -->
                <div class="unsaved-bar" id="unsavedBar" style="display:none;">
                    ⚠️ 有未保存的更改
                </div>
            </main>
        </div>
    </div>

    <!-- ── Toast 消息 ── -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/data.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
