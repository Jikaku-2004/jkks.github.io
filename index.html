<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#120d1f">
    <meta name="description" content="JKK 的个人记录终端：阅读、艺术、运动与研究。">
    <title>JKK's Personal Page</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Markdown渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <a class="skip-link" href="#mainContent">跳至主要内容</a>
    <div class="crt-overlay" aria-hidden="true"></div>

    <!-- 顶部导航栏 -->
    <header class="top-bar">
        <div class="top-bar-inner">
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
            <a href="#" class="site-title" id="siteTitle"><span class="title-prompt">&gt;</span> JKK.OS</a>
            <div class="top-bar-right">
                <span class="system-status"><i></i> ONLINE</span>
                <div class="lang-toggle" id="langToggle">
                    <span class="lang-option active" data-lang="zh">中</span>
                    <span class="lang-divider">|</span>
                    <span class="lang-option" data-lang="en">EN</span>
                </div>
            </div>
        </div>
    </header>

    <div class="layout">
        <!-- 左侧导航 -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-label"><span>CHANNELS</span><span>01—05</span></div>
            <ul class="nav-list" id="navList">
                <!-- 由JS动态生成 -->
            </ul>
            <div class="sidebar-footer">
                <div class="music-player" id="musicPlayer">
                    <div class="music-player-header">
                        <span class="sidebar-label music-label">MUSIC PLAYER</span>
                    </div>
                    <div class="music-info" id="musicInfo">
                        <span class="music-title" id="musicTitle">--</span>
                    </div>
                    <div class="music-controls">
                        <button class="music-btn" id="musicPrev" title="上一首">⏮</button>
                        <button class="music-btn music-btn-play" id="musicPlay" title="播放/暂停">▶</button>
                        <button class="music-btn" id="musicNext" title="下一首">⏭</button>
                        <button class="music-btn" id="musicRandom" title="随机">🔀</button>
                        <button class="music-btn" id="musicLoop" title="循环">🔁</button>
                    </div>
                    <audio id="musicAudio" preload="none"></audio>
                </div>
                <a href="#" class="nav-item" id="navAbout">
                    <span class="nav-icon"><span class="pixel-icon">AB</span></span>
                    <span class="nav-label" data-key="aboutJikaku">关于Jikaku</span>
                </a>
                <a href="#" class="nav-item" id="navContact">
                    <span class="nav-icon"><span class="pixel-icon">CT</span></span>
                    <span class="nav-label" data-key="contact">联系方式</span>
                </a>
            </div>
        </nav>

        <!-- 右侧内容区 -->
        <main class="content" id="mainContent">
            <!-- 欢迎页面 -->
            <div class="welcome-page" id="welcomePage">
                <div class="welcome-card">
                    <div class="window-bar">
                        <span>WELCOME.EXE</span>
                        <span class="window-controls">■ □ ×</span>
                    </div>
                    <h1 class="welcome-title" data-key="welcomeTitle">欢迎来到Jikaku的个人网页</h1>
                    <p class="welcome-motto" data-key="welcomeMotto">热爱 忠诚 荣光</p>
                    <div class="welcome-desc" data-key="welcomeDesc">
                        <p>这里是我记录阅读、艺术、运动与研究的个人空间。</p>
                        <p>请从左侧导航栏选择感兴趣的分类开始探索。</p>
                    </div>
                    <div class="welcome-status">
                        <p data-key="welcomeQuote">“今天会是一个好日子” —— jkk</p>
                    </div>
                </div>
            </div>

            <!-- 分类内容容器 -->
            <div class="category-page" id="categoryPage" style="display:none;">
                <div class="category-header">
                    <div class="window-bar">
                        <span>ARCHIVE.DB</span>
                        <span class="window-controls">■ □ ×</span>
                    </div>
                    <h2 class="category-title" id="categoryTitle"></h2>
                    <p class="category-desc" id="categoryDesc"></p>
                </div>
                <div class="subcategory-tabs" id="subcategoryTabs">
                    <!-- 子分类标签由JS生成 -->
                </div>
                <div class="entries-container" id="entriesContainer">
                    <!-- 条目由JS生成 -->
                </div>
            </div>

            <!-- 关于Jikaku页面 -->
            <div class="about-page" id="aboutPage" style="display:none;">
                <div class="about-card">
                    <div class="window-bar">
                        <span>ABOUT.EXE</span>
                        <span class="window-controls">■ □ ×</span>
                    </div>
                    <div class="about-content markdown-body" id="aboutContent">
                        <!-- 由JS渲染Markdown -->
                    </div>
                </div>
            </div>
            <!-- 联系方式页面 -->
            <div class="contact-page" id="contactPage" style="display:none;">
                <!-- 由JS生成 -->
            </div>
        </main>
    </div>

    <!-- 图片灯箱 -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightboxImg">
    </div>

    <!-- 页脚 -->
    <footer class="site-footer">
        <div class="footer-inner">
            <span class="footer-signal">◆ SIGNAL STABLE</span>
            <span data-key="footerText">© 2026 JKK // SIGNAL BUILT</span>
            <span class="footer-clock" id="systemClock">00:00:00 CST</span>
        </div>
    </footer>

    <!-- 脚本 -->
    <script src="js/i18n.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
