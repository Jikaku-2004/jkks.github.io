<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JKK's Personal Page</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Markdown渲染库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <!-- 顶部导航栏 -->
    <header class="top-bar">
        <div class="top-bar-inner">
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
            <a href="#" class="site-title" id="siteTitle" data-key="siteTitle">JKK</a>
            <div class="top-bar-right">
                <div class="lang-toggle" id="langToggle">
                    <span class="lang-option active" data-lang="zh">中</span>
                    <span class="lang-divider">|</span>
                    <span class="lang-option" data-lang="en">EN</span>
                </div>
            </div>
        </div>
    </header>

    <div class="layout">
        <!-- 左侧导航 -->
        <nav class="sidebar" id="sidebar">
            <ul class="nav-list" id="navList">
                <!-- 由JS动态生成 -->
            </ul>
            <div class="sidebar-footer">
                <a href="#" class="nav-item" id="navContact" data-key="navContact">
                    <span class="nav-icon">✉️</span>
                    <span class="nav-label" data-key="contact">联系方式</span>
                </a>
            </div>
        </nav>

        <!-- 右侧内容区 -->
        <main class="content" id="mainContent">
            <!-- 欢迎页面 -->
            <div class="welcome-page" id="welcomePage">
                <div class="welcome-card">
                    <div class="avatar-area">
                        <div class="avatar-placeholder">JKK</div>
                    </div>
                    <h1 class="welcome-title" data-key="welcomeTitle">欢迎来到JKK的个人网页</h1>
                    <p class="welcome-subtitle" data-key="welcomeSubtitle">探索 · 思考 · 记录</p>
                    <div class="welcome-desc" data-key="welcomeDesc">
                        <p>这里是我记录阅读、艺术、运动与研究的个人空间。</p>
                        <p>请从左侧导航栏选择感兴趣的分类开始探索。</p>
                    </div>
                    <div class="welcome-quote">
                        <blockquote data-key="welcomeQuote">
                            "人生还不如一行波德莱尔。" —— 芥川龙之介
                        </blockquote>
                    </div>
                </div>
            </div>

            <!-- 分类内容容器 -->
            <div class="category-page" id="categoryPage" style="display:none;">
                <div class="category-header">
                    <h2 class="category-title" id="categoryTitle"></h2>
                    <p class="category-desc" id="categoryDesc"></p>
                </div>
                <div class="subcategory-tabs" id="subcategoryTabs">
                    <!-- 子分类标签由JS生成 -->
                </div>
                <div class="entries-container" id="entriesContainer">
                    <!-- 条目由JS生成 -->
                </div>
            </div>

            <!-- 联系方式页面 -->
            <div class="contact-page" id="contactPage" style="display:none;">
                <!-- 由JS生成 -->
            </div>
        </main>
    </div>

    <!-- 图片灯箱 -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightboxImg">
    </div>

    <!-- 页脚 -->
    <footer class="site-footer">
        <div class="footer-inner">
            <span data-key="footerText">© 2026 JKK. 用 ❤️ 打造</span>
        </div>
    </footer>

    <!-- 脚本 -->
    <script src="js/i18n.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
